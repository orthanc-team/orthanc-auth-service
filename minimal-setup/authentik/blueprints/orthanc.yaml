version: 1
metadata:
  name: Orthanc demo
entries:
  # group names must match the roles of permissions.jsonc
  - model: authentik_core.group
    id: group-admin
    identifiers: { name: admin-role }
  - model: authentik_core.group
    id: group-doctor
    identifiers: { name: doctor-role }

  # demo only: never ship these passwords
  - model: authentik_core.user
    identifiers: { username: admin-demo }
    attrs:
      name: Demo Admin
      email: admin-demo@example.com
      password: change-me
      groups: [!KeyOf group-admin]
  - model: authentik_core.user
    identifiers: { username: doctor-demo }
    attrs:
      name: Demo Doctor
      email: doctor-demo@example.com
      password: change-me
      groups: [!KeyOf group-doctor]

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers: { name: Orthanc }
    attrs:
      client_type: public
      client_id: orthanc
      grant_types: [authorization_code]
      # no refresh tokens: the session length is the access token validity
      access_token_validity: hours=8
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # asymmetric key: required by orthanc-auth-service (the default HS256 is not supported)
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: regex
          # no leading ^: Authentik urlparse()s the url for CORS; matching is a fullmatch anyway
          url: http://localhost/orthanc/ui/app/.*
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

  - model: authentik_core.application
    identifiers: { slug: orthanc }
    attrs:
      name: Orthanc
      provider: !KeyOf provider
